name: Bug report
description: Something in KediCAD did not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked KediCAD, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Chat log excerpt
      description: >
        The relevant part of the log from the LOG/ folder (right-click in the panel).
        Please remove anything personal before pasting.
      render: text
  - type: input
    id: freecad
    attributes:
      label: FreeCAD version
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (claude --version)
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
